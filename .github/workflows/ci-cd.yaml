name: Pipeline CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Testes, build e deploy simulado
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Executar testes automatizados
        run: npm test

      - name: Gerar build
        run: npm run build

      - name: Conferir arquivos gerados
        run: ls -la dist

      - name: Deploy simulado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "Deploy simulado realizado com sucesso!"
